<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Basin — world prototype</title>
<link rel="icon" href="data:," />
<style>
  html,body{margin:0;height:100%;background:#0f1512;overflow:hidden;font-family:ui-monospace,Menlo,monospace}
  canvas{display:block}
  #dbg{position:fixed;left:10px;top:10px;color:#e8e4d8;font-size:11px;line-height:1.5;background:rgba(15,21,18,.72);padding:8px 10px;border:1px solid #2a3a33;border-radius:4px;max-width:260px;user-select:none}
  #dbg b{color:#ff6a2b;font-weight:600}
  #dbg button{background:#16201b;color:#e8e4d8;border:1px solid #4d6358;border-radius:3px;font:inherit;padding:2px 6px;margin:2px 2px 0 0;cursor:pointer}
  #dbg button:hover{border-color:#ff6a2b}
  #zones{display:grid;grid-template-columns:1fr 1fr;gap:0 4px;margin-top:4px}
  body.shot #dbg,body.no-debug #dbg{display:none}
  body.embed #loading{display:none}
  #loading{position:fixed;inset:0;display:grid;place-items:center;color:#8e9a92;font-size:12px;background:#0f1512;transition:opacity .6s}
</style>
</head>
<body>
<div id="loading">Surveying the Basin…</div>
<div id="dbg"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
